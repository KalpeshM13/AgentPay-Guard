services:
  - type: web
    name: agentpay-guard
    runtime: python
    region: oregon # closest to most users on free tier
    plan: free

    # ---- Source --------------------------------------------------------------
    buildCommand: |
      pip install --no-cache-dir -r requirements.txt

    startCommand: |
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --log-level info --no-access-log

    # ---- Environment ---------------------------------------------------------
    envVars:
      - key: APP_NAME
        value: "AgentPay Guard"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
      - key: LOG_FORMAT
        value: "text"

      # Generate a real secret:  python -c "import secrets; print(secrets.token_hex(32))"
      - key: SECRET_KEY
        sync: false # Prompts you for a unique key on first deploy

      # ---- Admin Account Seeding ---------------------------------------------
      - key: DEFAULT_OWNER_EMAIL
        sync: false # Prompts you for your secure admin email on first deploy
      - key: DEFAULT_OWNER_PASSWORD
        sync: false # Prompts you for your secure admin password on first deploy

      # ---- Firebase Configuration --------------------------------------------
      - key: FIREBASE_CREDENTIALS
        sync: false # Prompts you to paste your service account JSON string

      # ---- AI (optional — leave blank to disable) ----------------------------
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
